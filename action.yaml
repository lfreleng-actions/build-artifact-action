---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# build-artifact-action
name: "📦 Build Artifact"
description: "Pack a directory tree into a workflow artefact, or unpack one"
# Logic lives in scripts/ (Python 3, standard library only); this file
# only wires inputs to the environment and calls those scripts.

inputs:
  mode:
    description: "Operation to perform: 'pack' or 'unpack'"
    required: true
  artifact-name:
    description: "Name of the workflow artefact; must match ^[A-Za-z0-9._-]+$"
    required: true
  artifact-id:
    description: >-
      [unpack] Numeric artefact ID from a producer's 'artifact-id'
      output; when set, download by ID and check 'artifact-name'
      against the downloaded artefact's name
    required: false
    default: ""
  path:
    description: >-
      [pack] Directory the packed paths are relative to; must resolve
      inside GITHUB_WORKSPACE
    required: false
    default: "."
  paths:
    description: >-
      [pack] Newline-separated files and directories under 'path' to
      pack; empty packs everything under 'path'
    required: false
    default: ""
  destination:
    description: >-
      [unpack] Directory to extract into; must resolve inside
      GITHUB_WORKSPACE. Required in unpack mode
    required: false
  expected-digest:
    description: >-
      [unpack] SHA-256 (64 lower-case hex) of the manifest; extract only
      when the downloaded manifest hashes to it
    required: false
    default: ""
  retention-days:
    description: "[pack] Days to retain the artefact, from 1 to 90"
    required: false
    default: "1"
  fail-on-empty:
    description: "[pack] Fail when nothing matched 'paths' (true/false)"
    required: false
    default: "true"
  overwrite:
    description: >-
      [pack] Replace an artefact of the same name in this run
      (true/false)
    required: false
    default: "false"

outputs:
  artifact-id:
    description: "[pack] The ID actions/upload-artifact returned"
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-name:
    description: "The artefact name used or verified"
    value: ${{ steps.validate.outputs.artifact_name }}
  digest:
    description: "SHA-256 of the manifest"
    value: ${{ steps.pack.outputs.digest || steps.unpack.outputs.digest }}
  file-count:
    description: "Files packed, or files extracted"
    # yamllint disable-line rule:line-length
    value: ${{ steps.pack.outputs.file-count || steps.unpack.outputs.file-count }}
  destination:
    description: "[unpack] Absolute path of the extraction root"
    value: ${{ steps.unpack.outputs.destination }}

runs:
  using: "composite"
  steps:
    - name: "Validate inputs"
      id: validate
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_ARTIFACT_ID: ${{ inputs.artifact-id }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_DESTINATION: ${{ inputs.destination }}
        INPUT_EXPECTED_DIGEST: ${{ inputs.expected-digest }}
        INPUT_RETENTION_DAYS: ${{ inputs.retention-days }}
        INPUT_FAIL_ON_EMPTY: ${{ inputs.fail-on-empty }}
        INPUT_OVERWRITE: ${{ inputs.overwrite }}
      run: |
        # Validate inputs
        python3 -I "${GITHUB_ACTION_PATH}/scripts/validate.py"

    - name: "Pack"
      id: pack
      if: inputs.mode == 'pack'
      shell: bash
      env:
        PACK_ROOT: ${{ steps.validate.outputs.root }}
        PACK_PATHS: ${{ steps.validate.outputs.paths }}
        PACK_ARTIFACT_NAME: ${{ steps.validate.outputs.artifact_name }}
        PACK_FAIL_ON_EMPTY: ${{ steps.validate.outputs.fail_on_empty }}
      run: |
        # Pack
        python3 -I -B "${GITHUB_ACTION_PATH}/scripts/pack.py"

    # The tar is the unit of transfer: zipping it again buys little and
    # costs time on hundreds of MB, so compression is off.
    - name: "Upload artefact"
      id: upload
      if: inputs.mode == 'pack'
      # yamllint disable-line rule:line-length
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.validate.outputs.artifact_name }}
        path: |
          ${{ steps.pack.outputs.tar }}
          ${{ steps.pack.outputs.manifest }}
        retention-days: ${{ steps.validate.outputs.retention_days }}
        overwrite: ${{ steps.validate.outputs.overwrite }}
        if-no-files-found: error
        compression-level: 0

    # The artefact is untrusted: download it into a fresh scratch
    # directory under RUNNER_TEMP, never into the workspace.
    - name: "Create download directory"
      id: scratch
      if: inputs.mode == 'unpack'
      shell: bash
      run: |
        # Create download directory
        scratch="$(mktemp -d "${RUNNER_TEMP}/build-artifact.XXXXXXXX")"
        echo "path=${scratch}" >> "$GITHUB_OUTPUT"

    # Same run only: no run-id and no github-token.
    - name: "Download artefact by name"
      if: inputs.mode == 'unpack' && steps.validate.outputs.artifact_id == ''
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ steps.validate.outputs.artifact_name }}
        path: ${{ steps.scratch.outputs.path }}

    - name: "Download artefact by ID"
      if: inputs.mode == 'unpack' && steps.validate.outputs.artifact_id != ''
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.validate.outputs.artifact_id }}
        path: ${{ steps.scratch.outputs.path }}

    - name: "Unpack"
      id: unpack
      if: inputs.mode == 'unpack'
      shell: bash
      env:
        INPUT_ARTIFACT_NAME: ${{ steps.validate.outputs.artifact_name }}
        INPUT_DESTINATION: ${{ inputs.destination }}
        INPUT_EXPECTED_DIGEST: ${{ steps.validate.outputs.expected_digest }}
        DOWNLOAD_DIR: ${{ steps.scratch.outputs.path }}
      run: |
        # Unpack
        python3 -I "${GITHUB_ACTION_PATH}/scripts/unpack.py"
