# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10 # Increase this timeout value as needed
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22'  # v0.17.1

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The unit tests include tests/test_stubs.py, which asserts that
      # pack.py and unpack.py exit 1 with their "not implemented"
      # diagnostic, so the pack failure below is that one and not a
      # missing or crashing script.
      - name: "Run unit tests"
        shell: bash
        run: |
          # Run unit tests
          python3 -m unittest discover -s tests

      # Until the pack mode is implemented, valid pack inputs pass
      # validation and then fail in the Pack step. The artifact-name
      # output comes from the validation step, so a non-empty value
      # shows the failure came after validation, from the Pack step.
      - name: "Running local action: ${{ github.repository }} [pack]"
        uses: $/
        id: pack
        continue-on-error: true
        with:
          mode: "pack"
          artifact-name: "test-artifact"
          path: "."

      - name: "Error if pack did not fail as not implemented"
        shell: bash
        env:
          OUTCOME: ${{ steps.pack.outcome }}
          ARTIFACT_NAME: ${{ steps.pack.outputs.artifact-name }}
        run: |
          # Error if pack did not fail as not implemented
          if [ "$OUTCOME" != "failure" ]; then
            echo "Error: pack step did not fail ❌"
            exit 1
          fi
          if [ "$ARTIFACT_NAME" != "test-artifact" ]; then
            echo "Error: pack failed in validation, not as unimplemented ❌"
            exit 1
          fi
          echo "Pack validated, then failed as not implemented ✅"
          echo "Pack failed as not implemented ✅" >> "$GITHUB_STEP_SUMMARY"

      # yamllint disable-line rule:line-length
      - name: "Running local action: ${{ github.repository }} [Override Failure]"
        uses: $/
        id: failure
        continue-on-error: true
        with:
          mode: "invalid"
          artifact-name: "test-artifact"

      # Failure testing is also important
      - name: "Error if step above did NOT fail validation"
        if: >-
          steps.failure.outcome == 'success' ||
          steps.failure.outputs.artifact-name != ''
        shell: bash
        run: |
          # Error if step above did NOT fail validation
          echo "Error: previous test step did NOT fail validation ❌"
          exit 1
